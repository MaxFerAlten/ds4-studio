id = "rocm-deepseek41"
enabled = true
owner = "overlay"
description = """
Let DeepSeek V4.1 actually run on ROCm.

Upstream 4c64ae4 (in 5379c1c) enabled the V4.1 ROCm target graph itself:
DS4_HAS_DEEPSEEK41_GPU is now defined on ROCm, and ds4_rocm_unavailable.cu
carries the ds4_gpu_tp_init / _shutdown / _failed stubs this feature used to
add. Both parts were retired at that sync. The ROCm V4.1 entry points still
come from rocm/ds4_rocm_v41.cuh (feature rocm-strix-halo), not from upstream's
shared CUDA header.

What remains, measured rather than assumed:

  1. DS4_HAVE_V41_GPU (ds4.c): the fork gates its V4.1 GPU paths on this macro
     and upstream has no such macro, so every #if using it evaluated to 0;
  2. the gate additionally refuses the SSD quality / preload-experts /
     full-layers variants under ROCm, mirroring the downstream fork - those
     have no ROCm implementation.

ds4_engram.o also has to join the ROCm object set - see mk/overlay.mk. Upstream
leaves it out because ROCm never needed Engram.

SCOPE: this makes V4.1 build, link and pass its startup gate on ROCm. Whether
inference is numerically correct on this hardware is a separate question that
needs a real model run; nothing here has been validated against one.
"""

[upstream]
reviewed_sha = "5379c1c9ac315f1540371b06a3db88491d4059ff"

# Upstream f3967519 added an identical guard for DS4_HAS_QWEN4_GPU directly
# below this one, so the bare "#if !defined(DS4_NO_GPU) && !defined(...)" line
# now matches twice. Anchor on the define instead: it names the feature this
# patch actually owns, and stays unique however many neighbours appear.
[[anchors]]
file = "ds4.c"
kind = "exact"
text = "#define DS4_HAS_DEEPSEEK41_GPU 1"
count = 1

[[anchors]]
file = "ds4.c"
kind = "exact"
text = "                (e->backend == DS4_BACKEND_CUDA && !opt->cuda_tensor_parallel &&"
count = 1

[[shadow_patch]]
file = "ds4.c"
patch = "patches/core/rocm-deepseek41-enable.patch"

[[test]]
command = "make -f Makefile.overlay overlay-strix-halo"
required = true
