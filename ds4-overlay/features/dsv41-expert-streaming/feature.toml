id = "dsv41-expert-streaming"
enabled = true
owner = "overlay"
description = """
ROCm V4.1 prefill workspace and Engram staging on top of upstream's own ROCm
V4.1 SSD-streaming path.

Upstream 4c64ae4 (in 5379c1c) enabled the V4.1 ROCm target graph and, with it,
the pieces this feature used to port from the ds4-v41-rocm fork: compact
selected-expert loads at the router (the 2026-09-15 "missing compact selected
experts" decode failure), bounded per-layer expert loading in the prefill sweep,
and V4.1 memory admission. At that sync the fork's versions were retired in
favour of upstream's: the fork ROCm runtime and API-compat overlay files, the
two-layer staging scheduler (ds41_stream_layer_*), ds41_stream_table, the ROCm
admission patch and the engine fields it used (ds41_host_memory_baseline,
ds41_model_loaded), ds4_gpu_set_deepseek41_model / set_streaming_free_reserve.

What remains, all #ifdef DS4_ROCM_BUILD:

  * ds41_prefill_limit capped at 2048 rows for workspace sizing, with the
    logical chunk kept for the causal sweep (fork measurement: 3.50 GiB of
    buffers instead of 10.21 GiB at an 8K chunk);
  * host-side Engram rows (a 4096-row ring when pipelined), text mask and
    selected_comp buffers uploaded with ds4_gpu_tensor_write instead of
    writing through ds4_gpu_tensor_contents;
  * the gfx1151 HC projection through ds4_gpu_dsv41_hc_project (hc_sgemm
    plan in ds41_gpu_graph), which needs ds41_hc_mix_batch and
    ds41_after_attention_batch to carry the graph;
  * refusing --quality with streaming in the sweep.

The entry points they call live in rocm/ds4_rocm_v41.cuh (feature
rocm-strix-halo) and are declared by the ds4_gpu.h patch below.
"""

[upstream]
reviewed_sha = "5379c1c9ac315f1540371b06a3db88491d4059ff"

[[anchors]]
file = "ds4_gpu.h"
kind = "exact"
text = "int ds4_gpu_stream_expert_cache_seed_from_layer_selected("
count = 1

[[anchors]]
file = "ds4.c"
kind = "exact"
text = "} ds41_gpu_graph;"
count = 1

[[shadow_patch]]
file = "ds4.c"
patch = "patches/core/dsv41-expert-streaming__ds4.c.patch"

[[shadow_patch]]
file = "ds4_gpu.h"
patch = "patches/gpu/dsv41-expert-streaming__ds4_gpu.h.patch"

[[test]]
command = "make -f Makefile.overlay ds4_rocm.o"
required = true
