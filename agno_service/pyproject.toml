[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ds4-agno-service"
version = "0.1.0"
description = "DS4-Studio supervised Agno AgentOS sidecar"
requires-python = ">=3.10,<3.14"
dependencies = [
  "agno[os,sqlite,openai]==2.8.0",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
]

[project.scripts]
ds4-agno-service = "ds4_agno.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
